services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adminagenda-app:latest
    container_name: adminagenda-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8080:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_GRPC_HOST: ${WHATSAPP_GRPC_HOST:-host.docker.internal}
      WHATSAPP_GRPC_PORT: ${WHATSAPP_GRPC_PORT:-50051}
      WHATSAPP_GRPC_TLS: ${WHATSAPP_GRPC_TLS:-false}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache

  redis:
    image: redis:7.2-alpine
    container_name: adminagenda-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  storage-data:
  cache-data:
