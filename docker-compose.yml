services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adminagenda-app:latest
    container_name: adminagenda-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: adminagenda
      DB_USERNAME: adminagenda
      DB_PASSWORD: adminagenda
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_GRPC_HOST: ${WHATSAPP_GRPC_HOST:-host.docker.internal}
      WHATSAPP_GRPC_PORT: ${WHATSAPP_GRPC_PORT:-50051}
      WHATSAPP_GRPC_TLS: ${WHATSAPP_GRPC_TLS:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-code:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache

  nginx:
    image: nginx:1.27-alpine
    container_name: adminagenda-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - app-code:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.4
    container_name: adminagenda-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: adminagenda
      MYSQL_USER: adminagenda
      MYSQL_PASSWORD: adminagenda
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "adminagenda", "-padminagenda"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: adminagenda-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app-code:
  mysql-data:
  redis-data:
  storage-data:
  cache-data:
