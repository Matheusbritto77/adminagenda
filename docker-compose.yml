services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adminagenda-app:latest
    container_name: adminagenda-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_GRPC_HOST: ${WHATSAPP_GRPC_HOST:-host.docker.internal}
      WHATSAPP_GRPC_PORT: ${WHATSAPP_GRPC_PORT:-50051}
      WHATSAPP_GRPC_TLS: ${WHATSAPP_GRPC_TLS:-false}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-code:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache

  nginx:
    image: nginx:1.27-alpine
    container_name: adminagenda-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - app-code:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7.2-alpine
    container_name: adminagenda-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app-code:
  redis-data:
  storage-data:
  cache-data:
